<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>PDF 图纸气泡序号标注工具</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'</script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:"Segoe UI","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}#toolbar{background:#1e293b;color:#fff;padding:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:58px}button,label{font-size:13px}button{background:#3b82f6;color:#fff;border:0;border-radius:4px;padding:7px 11px;cursor:pointer}button.ok{background:#10b981}button.danger{background:#ef4444}button.dark{background:#475569}input{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:4px;padding:4px}.group{background:#334155;padding:5px 7px;border-radius:6px;display:flex;gap:5px;align-items:center}.pagebox input{width:48px;text-align:center}#editor{height:calc(100vh - 58px);overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}.zoomwrap{transform-origin:top center}#wrap{position:relative;background:#fff;box-shadow:0 4px 12px #0003}.pdfcanvas{display:block}.layer{position:absolute;inset:0}.badge{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:move;font-weight:bold;user-select:none}.sel{outline:2px dashed #3b82f6;outline-offset:4px}@media print{#toolbar{display:none}#editor{height:auto;overflow:visible;padding:0}body{background:#fff;overflow:visible}}</style></head><body><div id="toolbar"><div class="group"><button id="openBtn">📂 打开 PDF</button><input id="file" type="file" accept="application/pdf" style="display:none"><button id="save" class="ok">💾 保存 PDF</button><button id="print" class="dark">🖨 打印</button></div><div class="group"><button id="prev">◀ 上一页</button><input id="pageInput" type="number" value="1" min="1"><span>/ <b id="pageCount">0</b></span><button id="next">下一页 ▶</button></div><div class="group"><button id="zoomOut" class="dark">−</button><span id="zoomInfo">100%</span><button id="zoomIn" class="dark">＋</button><button id="zoomFit" class="dark">适合窗口</button></div><div class="group"><button id="mode">📍 点击添加</button><label>序号</label><input id="seq" type="number" value="1" min="1" style="width:55px"></div><div class="group"><label>大小</label><input id="size" type="number" value="26" min="10" max="80" style="width:55px"><label>粗细</label><input id="border" type="number" value="2" min="1" max="10" style="width:45px"><label>字号</label><input id="font" type="number" value="13" min="8" max="36" style="width:45px"></div><div class="group"><label>外圈</label><input id="outer" type="color" value="#ff0000"><label>字体</label><input id="text" type="color" value="#ff0000"><label><input id="transparent" type="checkbox" checked>透明背景</label><label>填充</label><input id="inner" type="color" value="#ffffff"><label>透明度</label><input id="opacity" type="range" min="0" max="1" step=".1" value="1"></div><div class="group"><button id="undo">↩ 撤销</button><button id="clear" class="danger">🗑 清空</button></div><span id="info">未加载图纸</span></div><div id="editor"><div class="zoomwrap" id="zoomwrap"><div id="wrap"><canvas id="canvas" class="pdfcanvas"></canvas><div id="layer" class="layer"></div></div></div></div><script>let pdf=null,buf=null,pageNo=1,scale=1.5,ann=[],selected=null,addMode=true,sourceName='document.pdf',sourceHandle=null;const baseScale=1.5,c=document.getElementById('canvas'),ctx=c.getContext('2d'),layer=document.getElementById('layer'),wrap=document.getElementById('wrap'),zoomwrap=document.getElementById('zoomwrap');const $=id=>document.getElementById(id);function rgba(h,a){let n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}function rgb(h){let n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)}function updateZoom(){zoomwrap.style.transform=`scale(${scale/baseScale})`;$('zoomInfo').textContent=Math.round(scale/baseScale*100)+'%'}async function loadFile(f,h){sourceName=f.name;sourceHandle=h||null;buf=await f.arrayBuffer();pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;ann=[];pageNo=1;$('pageCount').textContent=pdf.numPages;$('pageInput').value=1;layer.innerHTML='';scale=1.5;updateZoom();await render()}$('openBtn').onclick=async()=>{if(window.showOpenFilePicker){try{let [h]=await window.showOpenFilePicker({types:[{description:'PDF files',accept:{'application/pdf':['.pdf']}}]});await loadFile(await h.getFile(),h)}catch(e){if(e.name!=='AbortError')$('file').click()}}else $('file').click()};$('file').onchange=async e=>{let f=e.target.files[0];if(f)await loadFile(f,null)};async function render(){if(!pdf)return;let p=await pdf.getPage(pageNo),v=p.getViewport({scale});c.width=v.width;c.height=v.height;wrap.style.width=v.width+'px';wrap.style.height=v.height+'px';await p.render({canvasContext:ctx,viewport:v}).promise;layer.innerHTML='';$('info').textContent=`第 ${pageNo}/${pdf.numPages} 页 · ${Math.round(scale/baseScale*100)}%`;ann.filter(a=>a.page===pageNo).forEach(addDom)}async function goPage(n){if(!pdf)return;pageNo=Math.max(1,Math.min(pdf.numPages,n));$('pageInput').value=pageNo;selected=null;await render()}$('prev').onclick=()=>goPage(pageNo-1);$('next').onclick=()=>goPage(pageNo+1);$('pageInput').onchange=()=>goPage(+$('pageInput').value||1);$('zoomIn').onclick=async()=>{if(!pdf)return;scale=Math.min(5,scale+.25);updateZoom();await render()};$('zoomOut').onclick=async()=>{if(!pdf)return;scale=Math.max(.5,scale-.25);updateZoom();await render()};$('zoomFit').onclick=async()=>{if(!pdf)return;let avail=Math.max(400,$('editor').clientWidth-50),p=await pdf.getPage(pageNo),v=p.getViewport({scale:1});scale=Math.max(.5,Math.min(3,avail/v.width));updateZoom();await render()};$('mode').onclick=()=>{addMode=!addMode;$('mode').classList.toggle('ok',addMode);$('mode').textContent=addMode?'📍 点击添加':'🖱 选择/拖动'};layer.onclick=e=>{if(e.target!==layer||!addMode||!pdf)return;let r=layer.getBoundingClientRect(),a={id:crypto.randomUUID(),page:pageNo,nx:(e.clientX-r.left)/r.width,ny:(e.clientY-r.top)/r.height,text:String(+$('seq').value||1),size:+$('size').value||26,border:+$('border').value||2,font:+$('font').value||13,outer:$('outer').value,textColor:$('text').value,inner:$('inner').value,transparent:$('transparent').checked,opacity:+$('opacity').value};ann.push(a);addDom(a);$('seq').value=+a.text+1};function addDom(a){let d=document.createElement('div');d.className='badge';d.dataset.id=a.id;d.textContent=a.text;d.style.left=(a.nx*100)+'%';d.style.top=(a.ny*100)+'%';d.style.width=d.style.height=a.size+'px';d.style.border=`${a.border}px solid ${a.outer}`;d.style.color=a.textColor;d.style.fontSize=a.font+'px';d.style.background=a.transparent?'transparent':rgba(a.inner,a.opacity);d.onmousedown=e=>startDrag(e,d,a);d.onclick=e=>{e.stopPropagation();select(d)};d.oncontextmenu=e=>{e.preventDefault();remove(a.id)};layer.appendChild(d)}function select(d){if(selected)selected.classList.remove('sel');selected=d;if(d)d.classList.add('sel')}function remove(id){ann=ann.filter(a=>a.id!==id);document.querySelector(`[data-id="${id}"]`)?.remove();if(selected?.dataset.id===id)selected=null}function startDrag(e,d,a){if(addMode)return;e.preventDefault();select(d);let r=layer.getBoundingClientRect(),x0=e.clientX,y0=e.clientY,nx0=a.nx,ny0=a.ny;function mv(x){a.nx=Math.max(0,Math.min(1,nx0+(x.clientX-x0)/r.width));a.ny=Math.max(0,Math.min(1,ny0+(x.clientY-y0)/r.height));d.style.left=(a.nx*100)+'%';d.style.top=(a.ny*100)+'%'}function up(){removeEventListener('mousemove',mv);removeEventListener('mouseup',up)}addEventListener('mousemove',mv);addEventListener('mouseup',up)}$('undo').onclick=()=>{let a=ann.pop();if(a)document.querySelector(`[data-id="${a.id}"]`)?.remove()};$('clear').onclick=()=>{ann=[];layer.innerHTML='';selected=null};document.onkeydown=e=>{if((e.key==='Delete'||e.key==='Backspace')&&selected)remove(selected.dataset.id)};async function makeVectorPdf(){if(!buf||!pdf)return null;let doc=await PDFLib.PDFDocument.load(buf.slice(0));let font=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);let pages=doc.getPages();for(let i=0;i<pages.length;i++){let p=pages[i],{width,height}=p.getSize();for(let a of ann.filter(x=>x.page===i+1)){let x=a.nx*width,y=height-a.ny*height,size=a.size/baseScale,border=a.border/baseScale,fontSize=a.font/baseScale;p.drawCircle({x,y,size,borderWidth:border,borderColor:rgb(a.outer),borderOpacity:1,color:a.transparent?undefined:rgb(a.inner),opacity:a.transparent?0:a.opacity});let tw=font.widthOfTextAtSize(a.text,fontSize),th=font.heightAtSize(fontSize);p.drawText(a.text,{x:x-tw/2,y:y-th/2+fontSize*.12,size:fontSize,font,color:rgb(a.textColor)})}}return await doc.save()}function outputName(){let base=sourceName.replace(/\.[^.]+$/,'');return`${base} - Bubble Drawing.pdf`}$('save').onclick=async()=>{if(!pdf)return alert('请先打开 PDF');if(!ann.length)return alert('请先添加气泡');let bytes=await makeVectorPdf();if(window.showSaveFilePicker&&sourceHandle){try{let h=await window.showSaveFilePicker({suggestedName:outputName(),startIn:sourceHandle,types:[{description:'PDF files',accept:{'application/pdf':['.pdf']}}]});let w=await h.createWritable();await w.write(bytes);await w.close();$('info').textContent='已保存：'+h.name;return}catch(e){if(e.name==='AbortError')return}}let blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=outputName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('print').onclick=async()=>{if(!pdf)return alert('请先打开 PDF');let bytes=ann.length?await makeVectorPdf():new Uint8Array(buf),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));let w=window.open(url,'_blank');if(w)setTimeout(()=>{try{w.focus();w.print()}catch(e){}},1800);else alert('浏览器阻止了打印窗口，请允许弹出窗口后重试。')};updateZoom();</script></body></html>
