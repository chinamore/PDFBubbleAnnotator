<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Bubble Annotator · 图纸助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#f1f4f8;color:#172033;font:13px "Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{border:1px solid #cbd5e1;background:#fff;color:#263244;border-radius:5px;padding:6px 10px;cursor:pointer}button:hover{background:#eaf2ff;border-color:#7aa7e8}button.primary{background:#1677ff;color:#fff;border-color:#1677ff}button.success{background:#16a36a;color:#fff;border-color:#16a36a}.danger{color:#b42318!important}.muted{color:#64748b}.app{height:100vh;display:grid;grid-template-rows:42px 40px 1fr 25px}
.top{display:flex;align-items:center;padding:0 12px;background:#0f1d32;color:#fff;gap:16px}.brand{font-size:15px;font-weight:700}.topnav{display:flex;gap:4px}.topnav button{background:transparent;color:#dce7f7;border-color:transparent;padding:7px 10px}.topnav button.active{background:#263a57;color:#fff}.topright{margin-left:auto;display:flex;gap:8px;align-items:center}.version{font-size:11px;color:#9fb1ca}
.ribbon{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#fff;border-bottom:1px solid #dbe2ea;box-shadow:0 1px 2px #0001}.rgroup{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid #e2e8f0}.rgroup:last-child{border:0}.rgroup label{font-size:11px;color:#64748b;margin:0 2px}.ribbon button{padding:5px 8px;font-size:12px}.tool.active{background:#dbeafe;border-color:#60a5fa;color:#0757b8}
.workspace{min-height:0;display:grid;grid-template-columns:240px 1fr 260px;gap:1px;background:#cbd5e1}.panel{background:#fff;min-width:0;overflow:auto}.panel-title{padding:9px 11px;font-weight:700;border-bottom:1px solid #e5e7eb;background:#f8fafc}.section{padding:10px;border-bottom:1px solid #e5e7eb}.section h4{margin:0 0 8px;font-size:12px}.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row>*:last-child{margin-left:auto}.field{width:80px;border:1px solid #cbd5e1;border-radius:4px;padding:5px}.color{width:35px;height:26px;padding:1px}.check{margin-right:4px}
.center{position:relative;overflow:auto;background:#dfe5ec}.canvasbar{position:sticky;top:0;z-index:5;height:34px;background:#26364d;color:#fff;display:flex;align-items:center;padding:0 8px;gap:8px}.canvasbar span{font-size:12px}.viewer{min-width:700px;min-height:calc(100% - 34px);padding:25px;display:flex;justify-content:center;align-items:flex-start}.paper{position:relative;background:#fff;box-shadow:0 5px 22px #0003}.paper canvas{display:block}.overlay{position:absolute;inset:0}.badge{position:absolute;transform:translate(-50%,-50%);border:2px solid #ef3340;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#ef3340;background:#fff;font-weight:700;cursor:move;user-select:none}.badge.sel{outline:2px dashed #1677ff;outline-offset:3px}.mark{position:absolute;pointer-events:none}.empty{color:#64748b;text-align:center;padding:70px 20px}.empty strong{display:block;font-size:20px;color:#334155;margin-bottom:10px}
.list{padding:6px}.item{display:flex;align-items:center;gap:6px;padding:7px;border-radius:5px}.item:hover{background:#f1f5f9}.dot{width:9px;height:9px;border-radius:50%;background:#1677ff}.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:8px}.stat b{display:block;font-size:17px}.status{background:#0f1d32;color:#dbe7f5;padding:4px 10px;font-size:11px;display:flex;justify-content:space-between}.hidden{display:none}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50}.modal.show{display:flex}.dialog{width:520px;background:#fff;border-radius:8px;box-shadow:0 15px 50px #0005;padding:18px}.dialog h3{margin:0 0 12px}.dialog .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">📐 PDF Bubble Annotator</div><nav class="topnav"><button class="active" data-tab="draw">图纸</button><button data-tab="convert">转换</button><button data-tab="measure">测量</button><button data-tab="manage">管理</button></nav><div class="topright"><span class="version">Professional Workspace · v0.2</span></div></header>
<div class="ribbon">
<div class="rgroup"><button id="openBtn" class="primary">📂 打开</button><input id="file" type="file" accept="application/pdf" class="hidden"><button id="save" class="success">💾 导出PDF</button><button id="print">🖨 打印</button></div>
<div class="rgroup"><button id="prev">◀</button><input id="pageInput" class="field" value="1" style="width:48px;text-align:center"><span>/ <b id="pageCount">0</b></span><button id="next">▶</button></div>
<div class="rgroup"><button id="zoomOut">−</button><span id="zoomInfo">100%</span><button id="zoomIn">＋</button><button id="zoomFit">适合</button></div>
<div class="rgroup"><button class="tool active" data-tool="select">🖱选择</button><button class="tool" data-tool="bubble">①气泡</button><button class="tool" data-tool="cloud">☁云线</button><button class="tool" data-tool="leader">↗引线</button><button class="tool" data-tool="text">T文字</button></div>
<div class="rgroup"><button class="tool" data-tool="line">╱长度</button><button class="tool" data-tool="area">▱面积</button><button class="tool" data-tool="circle">○半径</button><button class="tool" data-tool="angle">∠角度</button></div>
<div class="rgroup"><button id="copy">复制</button><button id="undo">↶撤销</button><button id="redo">↷重做</button><button id="clear" class="danger">清空</button></div>
</div>
<div class="workspace">
<aside class="panel">
<div class="panel-title">工具箱</div>
<div class="section"><h4>标注</h4><div class="row"><span>序号起始</span><input id="seq" class="field" type="number" value="1" min="1"></div><div class="row"><span>气泡大小</span><input id="size" class="field" type="number" value="28"></div><div class="row"><span>边框粗细</span><input id="border" class="field" type="number" value="2"></div><div class="row"><span>字号</span><input id="font" class="field" type="number" value="13"></div><div class="row"><span>颜色</span><input id="outer" class="color" type="color" value="#ef3340"></div></div>
<div class="section"><h4>快速功能</h4><button id="batchPng" style="width:100%;margin-bottom:6px">🖼 批量 PDF → 图片</button><button id="extractText" style="width:100%;margin-bottom:6px">T 提取全部文字</button><button id="exportCsv" style="width:100%;margin-bottom:6px">⇩ 导出标注统计 CSV</button><button id="compare" style="width:100%">⇄ 图纸版本对比</button></div>
<div class="section"><h4>图层</h4><label><input class="check" type="checkbox" checked>原图</label><br><label><input class="check" type="checkbox" checked>气泡标注</label><br><label><input class="check" type="checkbox" checked>测量结果</label><br><label><input class="check" type="checkbox" checked>辅助线</label></div>
<div class="section"><h4>统计</h4><div class="stat"><div><b id="bubbleCount">0</b>气泡</div><div><b id="markCount">0</b>测量</div></div></div>
</aside>
<main class="center"><div class="canvasbar"><span id="fileInfo">未打开图纸</span><span style="margin-left:auto">工具：<b id="toolName">选择</b></span></div><div class="viewer"><div id="paper" class="paper"><canvas id="canvas"></canvas><div id="overlay" class="overlay"></div></div><div id="empty" class="empty"><strong>打开 PDF 图纸开始工作</strong>支持翻页、矢量气泡、测量、批量转换与统计</div></div></main>
<aside class="panel"><div class="panel-title">属性 / 标注统计</div><div class="section"><h4>当前标注</h4><div id="prop">未选择对象</div></div><div class="section"><h4>标注列表</h4><div id="annList" class="list"></div></div><div class="section"><h4>版本对比</h4><button id="gray">原图灰显</button><button id="find" style="margin-left:5px">区域查找</button></div><div class="section"><h4>快捷键</h4><div class="muted">Space：平移　Delete：删除<br>Ctrl+C/V：复制/粘贴<br>+ / -：缩放　← / →：翻页</div></div></aside>
</div>
<footer class="status"><span id="status">就绪</span><span>矢量 PDF · 2D/3D CAD 功能分阶段接入</span></footer>
</div>
<div id="modal" class="modal"><div class="dialog"><h3 id="modalTitle">操作</h3><div id="modalBody"></div><div class="dialog-actions"><button id="modalCancel">取消</button><button id="modalOk" class="primary">确定</button></div></div></div>
<script>
let pdf=null,buf=null,pageNo=1,scale=1.5,sourceName='document.pdf',sourceHandle=null,ann=[],marks=[],selected=null,tool='select',history=[],future=[];
const baseScale=1.5,$=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),paper=$('paper');
function setStatus(s){$('status').textContent=s}function updateZoom(){$('zoomInfo').textContent=Math.round(scale/baseScale*100)+'%'}function updateStats(){$('bubbleCount').textContent=ann.length;$('markCount').textContent=marks.length;$('pageCount').textContent=pdf?pdf.numPages:0}
function snapshot(){history.push(JSON.stringify(ann));if(history.length>40)history.shift();future=[]}function restore(s){ann=JSON.parse(s);selected=null;renderAnnotations();updateStats()}
async function loadFile(f,h){sourceName=f.name;sourceHandle=h||null;buf=await f.arrayBuffer();pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;pageNo=1;ann=[];marks=[];scale=1.5;updateZoom();updateStats();$('pageInput').value=1;$('fileInfo').textContent=f.name;$('empty').style.display='none';await render();setStatus('已打开：'+f.name)}
$('openBtn').onclick=async()=>{if(window.showOpenFilePicker){try{let [h]=await window.showOpenFilePicker({types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});await loadFile(await h.getFile(),h)}catch(e){if(e.name!=='AbortError')$('file').click()}}else $('file').click()};$('file').onchange=e=>{let f=e.target.files[0];if(f)loadFile(f,null)};
async function render(){if(!pdf)return;let p=await pdf.getPage(pageNo),v=p.getViewport({scale});canvas.width=v.width;canvas.height=v.height;paper.style.width=v.width+'px';paper.style.height=v.height+'px';await p.render({canvasContext:ctx,viewport:v}).promise;renderAnnotations();$('pageInput').value=pageNo;$('fileInfo').textContent=`${sourceName} · 第 ${pageNo}/${pdf.numPages} 页`}
function goPage(n){if(!pdf)return;pageNo=Math.max(1,Math.min(pdf.numPages,n));render()}
$('prev').onclick=()=>goPage(pageNo-1);$('next').onclick=()=>goPage(pageNo+1);$('pageInput').onchange=()=>goPage(+$('pageInput').value||1);$('zoomIn').onclick=async()=>{scale=Math.min(6,scale+.25);updateZoom();await render()};$('zoomOut').onclick=async()=>{scale=Math.max(.5,scale-.25);updateZoom();await render()};$('zoomFit').onclick=async()=>{if(!pdf)return;let p=await pdf.getPage(pageNo),v=p.getViewport({scale:1});scale=Math.max(.5,Math.min(3,($('center')?.clientWidth||900)-100/v.width));updateZoom();await render()};
function toolName(t){return{select:'选择',bubble:'气泡',cloud:'云线',leader:'引线',text:'文字',line:'长度',area:'面积',circle:'半径',angle:'角度'}[t]||t}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool;$('toolName').textContent=toolName(tool);setStatus('当前工具：'+toolName(tool))});
function renderAnnotations(){overlay.innerHTML='';ann.filter(a=>a.page===pageNo).forEach(a=>{let d=document.createElement('div');d.className='badge'+(selected===a.id?' sel':'');d.dataset.id=a.id;d.textContent=a.text;d.style.left=a.nx*100+'%';d.style.top=a.ny*100+'%';d.style.width=d.style.height=a.size+'px';d.style.borderWidth=a.border+'px';d.style.color=a.color;d.style.borderColor=a.color;d.onclick=e=>{e.stopPropagation();selected=a.id;renderAnnotations();$('prop').textContent=`气泡 ${a.text} · X ${(a.nx*100).toFixed(1)}% · Y ${(a.ny*100).toFixed(1)}%`};d.onmousedown=e=>{if(tool!=='select')return;let r=overlay.getBoundingClientRect(),x=e.clientX,y=e.clientY,nx=a.nx,ny=a.ny;function mv(q){a.nx=Math.max(0,Math.min(1,nx+(q.clientX-x)/r.width));a.ny=Math.max(0,Math.min(1,ny+(q.clientY-y)/r.height));d.style.left=a.nx*100+'%';d.style.top=a.ny*100+'%'}function up(){removeEventListener('mousemove',mv);removeEventListener('mouseup',up);renderList()}addEventListener('mousemove',mv);addEventListener('mouseup',up)};overlay.appendChild(d)});renderList()}
function renderList(){$('annList').innerHTML=ann.map(a=>`<div class="item" data-a="${a.id}"><span class="dot"></span><b>${a.text}</b><span class="muted">P${a.page}</span></div>`).join('');updateStats()}
overlay.onclick=e=>{if(e.target!==overlay||!pdf)return;let r=overlay.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;if(tool==='bubble'){snapshot();let a={id:crypto.randomUUID(),page:pageNo,nx,ny,text:String(+$('seq').value||1),size:+$('size').value||28,border:+$('border').value||2,color:$('outer').value};ann.push(a);$('seq').value=+a.text+1;renderAnnotations();setStatus('已添加气泡 '+a.text)}else if(['line','area','circle','angle','cloud','leader','text'].includes(tool)){marks.push({tool,page:pageNo,nx,ny});setStatus(toolName(tool)+' 已记录，详细几何编辑器将在 CAD 引擎阶段接入');updateStats()}};
$('copy').onclick=()=>{let a=ann.find(x=>x.id===selected);if(!a)return; snapshot();ann.push({...a,id:crypto.randomUUID(),nx:Math.min(1,a.nx+.03),ny:Math.min(1,a.ny+.03),text:String(+$('seq').value||1)});$('seq').value++;renderAnnotations()};$('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(ann));restore(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(ann));restore(future.pop())};$('clear').onclick=()=>{snapshot();ann=[];renderAnnotations()};
function outputName(){return sourceName.replace(/\.[^.]+$/,'')+' - Bubble Drawing.pdf'}
async function makeVectorPdf(){let doc=await PDFLib.PDFDocument.load(buf.slice(0)),font=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold),pages=doc.getPages();for(let i=0;i<pages.length;i++){let p=pages[i],{width,height}=p.getSize();for(let a of ann.filter(x=>x.page===i+1)){let x=a.nx*width,y=height-a.ny*height,s=a.size/baseScale,fs=13/baseScale;p.drawCircle({x,y,size:s,borderWidth:a.border/baseScale,borderColor:PDFLib.rgb(239/255,51/255,64/255),color:undefined});let tw=font.widthOfTextAtSize(a.text,fs);p.drawText(a.text,{x:x-tw/2,y:y-fs/3,size:fs,font,color:PDFLib.rgb(239/255,51/255,64/255)})}}return doc.save()}
$('save').onclick=async()=>{if(!pdf)return alert('请先打开 PDF');let bytes=await makeVectorPdf();if(window.showSaveFilePicker){try{let h=await window.showSaveFilePicker({suggestedName:outputName(),startIn:sourceHandle||'downloads',types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});let w=await h.createWritable();await w.write(bytes);await w.close();setStatus('PDF 已保存：'+h.name);return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=outputName();a.click()};
$('print').onclick=async()=>{if(!pdf)return;let bytes=await makeVectorPdf(),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),w=window.open(url,'_blank');if(w)setTimeout(()=>w.print(),1200)};
$('batchPng').onclick=async()=>{if(!pdf)return alert('请先打开 PDF');let scaleOut=2;let parts=[];for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),v=p.getViewport({scale:scaleOut}),cc=document.createElement('canvas');cc.width=v.width;cc.height=v.height;await p.render({canvasContext:cc.getContext('2d'),viewport:v}).promise;parts.push(cc.toDataURL('image/png'))}let text=parts.map((x,i)=>`第 ${i+1} 页\n${x}`).join('\n');let blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sourceName.replace(/\.pdf$/i,'')+' - Images.txt';a.click();setStatus('已生成图片数据导出包（浏览器版）')};
$('extractText').onclick=async()=>{if(!pdf)return;let all=[];for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),t=await p.getTextContent();all.push(`===== 第 ${i} 页 =====\n`+t.items.map(x=>x.str).join(' '))}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([all.join('\n')],{type:'text/plain;charset=utf-8'}));a.download=sourceName.replace(/\.pdf$/i,'')+' - Text.txt';a.click();setStatus('文字提取完成')};
$('exportCsv').onclick=()=>{let rows=['序号,页码,X%,Y%'];ann.forEach(a=>rows.push(`${a.text},${a.page},${(a.nx*100).toFixed(2)},${(a.ny*100).toFixed(2)}`));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=sourceName.replace(/\.pdf$/i,'')+' - Bubble Statistics.csv';a.click()};
$('compare').onclick=()=>alert('版本对比界面已预留：下一阶段将加入双图同步缩放、差异高亮、原图灰显。');$('gray').onclick=()=>document.querySelector('.paper').style.filter=document.querySelector('.paper').style.filter?'':'grayscale(1)';$('find').onclick=()=>alert('区域查找将在 CAD 图形索引阶段支持文字、图形和区域搜索。');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');setStatus('工作区：'+b.textContent)});document.onkeydown=e=>{if(e.key==='Delete'&&selected){snapshot();ann=ann.filter(a=>a.id!==selected);selected=null;renderAnnotations()}if(e.key==='ArrowLeft')goPage(pageNo-1);if(e.key==='ArrowRight')goPage(pageNo+1);if(e.key==='+')$('zoomIn').click();if(e.key==='-')$('zoomOut').click()};updateZoom();updateStats();
</script></body></html>
