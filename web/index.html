<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>PDF 图纸气泡序号标注工具</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'</script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Segoe UI,sans-serif;height:100vh;overflow:hidden}#toolbar{background:#1e293b;color:#fff;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,label{font-size:13px}button{background:#3b82f6;color:white;border:0;border-radius:4px;padding:7px 12px;cursor:pointer}button.danger{background:#ef4444}button.ok{background:#10b981}input,select{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:4px;padding:4px}.group{background:#334155;padding:5px 8px;border-radius:6px;display:flex;gap:6px;align-items:center}#editor{height:calc(100vh - 62px);overflow:auto;padding:20px;display:flex;justify-content:center}#wrap{position:relative;background:#fff;box-shadow:0 4px 12px #0003}canvas{display:block}.layer{position:absolute;inset:0}.badge{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:move;font-weight:bold;user-select:none}.sel{outline:2px dashed #3b82f6;outline-offset:4px}</style></head><body><div id="toolbar"><div class="group"><label for="file">📂 打开 PDF</label><input id="file" type="file" accept="application/pdf"><button id="save" class="ok">⚡ 保存标注 PDF</button></div><div class="group"><button id="mode">📍 点击添加</button><label>序号</label><input id="seq" type="number" value="1" min="1" style="width:55px"></div><div class="group"><label>大小</label><input id="size" type="number" value="26" min="10" max="80" style="width:55px"><label>粗细</label><input id="border" type="number" value="2" min="1" max="10" style="width:45px"><label>字号</label><input id="font" type="number" value="13" min="8" max="36" style="width:45px"></div><div class="group"><label>外圈</label><input id="outer" type="color" value="#ff0000"><label>字体</label><input id="text" type="color" value="#ff0000"><label><input id="transparent" type="checkbox" checked>透明背景</label><label>填充</label><input id="inner" type="color" value="#ffffff"><label>透明度</label><input id="opacity" type="range" min="0" max="1" step=".1" value="1"></div><div class="group"><button id="undo">↩ 撤销</button><button id="clear" class="danger">🗑 清空</button></div><span id="info">未加载图纸</span></div><div id="editor"><div id="wrap"><canvas id="canvas"></canvas><div id="layer" class="layer"></div></div></div><script>
let pdf=null,buf=null,pageNo=1,scale=1.5,ann=[],selected=null,drag=null,addMode=true;const c=document.getElementById('canvas'),ctx=c.getContext('2d'),layer=document.getElementById('layer'),wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);function rgba(h,a){let n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;buf=await f.arrayBuffer();pdf=await pdfjsLib.getDocument({data:buf}).promise;ann=[];pageNo=1;layer.innerHTML='';await render();};
async function render(){let p=await pdf.getPage(pageNo),v=p.getViewport({scale});c.width=v.width;c.height=v.height;wrap.style.width=v.width+'px';wrap.style.height=v.height+'px';await p.render({canvasContext:ctx,viewport:v}).promise;$('info').textContent=`第 ${pageNo}/${pdf.numPages} 页`;ann.filter(a=>a.page===pageNo).forEach(addDom)}
$('mode').onclick=()=>{addMode=!addMode;$('mode').classList.toggle('ok',addMode);$('mode').textContent=addMode?'📍 点击添加':'🖱 选择/拖动'};
layer.onclick=e=>{if(e.target!==layer||!addMode||!pdf)return;let r=layer.getBoundingClientRect(),a={id:crypto.randomUUID(),page:pageNo,x:e.clientX-r.left,y:e.clientY-r.top,nx:(e.clientX-r.left)/r.width,ny:(e.clientY-r.top)/r.height,text:String(+$('seq').value||1),size:+$('size').value||26,border:+$('border').value||2,font:+$('font').value||13,outer:$('outer').value,textColor:$('text').value,inner:$('inner').value,transparent:$('transparent').checked,opacity:+$('opacity').value};ann.push(a);addDom(a);$('seq').value=+a.text+1};
function addDom(a){let d=document.createElement('div');d.className='badge';d.dataset.id=a.id;d.textContent=a.text;d.style.left=a.x+'px';d.style.top=a.y+'px';d.style.width=d.style.height=a.size+'px';d.style.border=`${a.border}px solid ${a.outer}`;d.style.color=a.textColor;d.style.fontSize=a.font+'px';d.style.background=a.transparent?'transparent':rgba(a.inner,a.opacity);d.onmousedown=e=>startDrag(e,d,a);d.onclick=e=>{e.stopPropagation();select(d)};d.oncontextmenu=e=>{e.preventDefault();remove(a.id)};layer.appendChild(d)}
function select(d){if(selected)selected.classList.remove('sel');selected=d;if(d)d.classList.add('sel')}function remove(id){ann=ann.filter(a=>a.id!==id);document.querySelector(`[data-id="${id}"]`)?.remove();if(selected?.dataset.id===id)selected=null}
function startDrag(e,d,a){if(addMode)return;e.preventDefault();select(d);let r=layer.getBoundingClientRect(),ox=e.clientX-(r.left+a.x),oy=e.clientY-(r.top+a.y);function mv(x){a.x=x.clientX-r.left-ox;a.y=x.clientY-r.top-oy;d.style.left=a.x+'px';d.style.top=a.y+'px';a.nx=a.x/r.width;a.ny=a.y/r.height}function up(){removeEventListener('mousemove',mv);removeEventListener('mouseup',up)}addEventListener('mousemove',mv);addEventListener('mouseup',up)}
$('undo').onclick=()=>{let a=ann.pop();if(a)document.querySelector(`[data-id="${a.id}"]`)?.remove()};$('clear').onclick=()=>{ann=[];layer.innerHTML='';selected=null};document.onkeydown=e=>{if((e.key==='Delete'||e.key==='Backspace')&&selected)remove(selected.dataset.id)};
$('save').onclick=async()=>{if(!pdf||!ann.length)return alert('请先打开 PDF 并添加气泡');let out=await PDFLib.PDFDocument.create();for(let n=1;n<=pdf.numPages;n++){let p=await pdf.getPage(n),v=p.getViewport({scale:3}),cc=document.createElement('canvas'),cx=cc.getContext('2d');cc.width=v.width;cc.height=v.height;await p.render({canvasContext:cx,viewport:v}).promise;for(let a of ann.filter(x=>x.page===n)){let x=a.nx*cc.width,y=a.ny*cc.height,r=a.size/2*2,w=a.border*2;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);if(!a.transparent){cx.fillStyle=rgba(a.inner,a.opacity);cx.fill()}cx.lineWidth=w;cx.strokeStyle=a.outer;cx.stroke();cx.fillStyle=a.textColor;cx.font=`bold ${a.font*2}px Arial`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(a.text,x,y)}let img=await out.embedPng(cc.toDataURL('image/png')),ov=p.getViewport({scale:1}),np=out.addPage([ov.width,ov.height]);np.drawImage(img,{x:0,y:0,width:ov.width,height:ov.height})}let bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='annotated.pdf';a.click()};
</script></body></html>
