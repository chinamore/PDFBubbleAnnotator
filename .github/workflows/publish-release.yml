name: Publish Latest Single EXE Release

on:
  workflow_run:
    workflows:
      - Build Single EXE Offline
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download single EXE artifact
        uses: actions/download-artifact@v5
        with:
          name: PDFBubbleAnnotator-Windows-x64-SingleEXE
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify single EXE
        shell: bash
        run: |
          set -euo pipefail
          test -s ./artifact/PDFBubbleAnnotator.exe
          file ./artifact/PDFBubbleAnnotator.exe
          test "$(stat -c%s ./artifact/PDFBubbleAnnotator.exe)" -gt 20000000

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v1.0-single-exe-${GITHUB_RUN_NUMBER}"
          else
            tag="v1.0-single-exe.${{ github.event.workflow_run.run_number }}"
          fi
          gh release create "$tag" ./artifact/PDFBubbleAnnotator.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PDF Bubble Annotator $tag · Single EXE Offline" \
            --generate-notes --latest
