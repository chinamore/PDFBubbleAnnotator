name: Publish Latest Release

on:
  workflow_run:
    workflows:
      - Build Windows EXE
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: PDFBubbleAnnotator-v0.3-Windows-x64
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -s ./artifact/PDFBubbleAnnotator-v0.3-Windows-x64.zip
          unzip -l ./artifact/PDFBubbleAnnotator-v0.3-Windows-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v0.3-manual-${GITHUB_RUN_NUMBER}"
          else
            tag="v0.3.${{ github.event.workflow_run.run_number }}"
          fi
          gh release create "$tag" ./artifact/PDFBubbleAnnotator-v0.3-Windows-x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PDF Bubble Annotator $tag" \
            --generate-notes \
            --latest
