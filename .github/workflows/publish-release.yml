name: Publish Latest Offline Release
on:
  workflow_run:
    workflows:
      - Build Windows Offline EXE
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download offline build artifact
        uses: actions/download-artifact@v5
        with:
          name: PDFBubbleAnnotator-Offline-Windows-x64
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify offline package
        shell: bash
        run: |
          set -euo pipefail
          test -s ./artifact/PDFBubbleAnnotator-Offline-Windows-x64.zip
          unzip -l ./artifact/PDFBubbleAnnotator-Offline-Windows-x64.zip | grep -E 'PDFBubbleAnnotator.exe|WebView2Loader.dll|MicrosoftEdgeWebView2RuntimeInstallerX64.exe|web/index.html|pdf.min.js|pdf.worker.min.js|pdf-lib.min.js|xlsx.full.min.js|jszip.min.js|docx.umd.min.js'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v0.4-offline-${GITHUB_RUN_NUMBER}"
          else
            tag="v0.4-offline.${{ github.event.workflow_run.run_number }}"
          fi
          gh release create "$tag" ./artifact/PDFBubbleAnnotator-Offline-Windows-x64.zip --repo "${GITHUB_REPOSITORY}" --title "PDF Bubble Annotator $tag · Offline" --generate-notes --latest
