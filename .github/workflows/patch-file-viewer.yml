name: Integrate file format viewer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<input id="file" type="file" accept="application/pdf" class="hidden">','<input id="file" type="file" accept=".pdf,.dxf,.dwg,image/*" class="hidden">')
          marker='<script src="./formats.js"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'\n</body>')
          p.write_text(s,encoding='utf-8')
          
          f=Path('web/formats.js')
          t=f.read_text(encoding='utf-8')
          old="const p=$('paper');p.innerHTML='';p.appendChild(document.importNode(svg,true));$('overlay').remove?.();"
          new="const p=$('paper');p.innerHTML='';p.appendChild(document.importNode(svg,true));const ov=document.createElement('div');ov.id='overlay';ov.className='overlay';p.appendChild(ov);"
          if old in t:
              t=t.replace(old,new)
          f.write_text(t,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/formats.js
          git diff --cached --quiet || git commit -m 'Preserve overlay for CAD file annotations'
          git push
