name: Build Single EXE Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vendor browser libraries for offline use
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'web\vendor'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $items = @(
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', "$root\pdf.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js', "$root\pdf.worker.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', "$root\pdf-lib.min.js")
          )
          foreach ($x in $items) {
            Invoke-WebRequest -Uri $x[0] -OutFile $x[1]
            if ((Get-Item $x[1]).Length -lt 1000) { throw "Invalid dependency: $($x[1])" }
          }

      - name: Patch HTML to local-only dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'web\index.html'
          $s = Get-Content $p -Raw -Encoding UTF8
          $s = $s -replace 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', './vendor/pdf.min.js'
          $s = $s -replace 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js', './vendor/pdf.worker.min.js'
          $s = $s -replace 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', './vendor/pdf-lib.min.js'
          Set-Content $p $s -Encoding UTF8

      - name: Build single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --onefile --windowed --name PDFBubbleAnnotator --icon app.ico `
            --add-data "web;web" `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6_WebEngine `
            main.py
          if (-not (Test-Path 'dist\PDFBubbleAnnotator.exe')) { throw 'EXE was not produced' }
          $size = (Get-Item 'dist\PDFBubbleAnnotator.exe').Length
          Write-Host "Single EXE size: $size bytes"
          if ($size -lt 20000000) { throw 'EXE is unexpectedly small; WebEngine was probably not bundled' }

      - name: Verify packaged resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\PDFBubbleAnnotator.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Output is not a Windows PE executable' }
          Write-Host 'PE header verification passed'
          Write-Host 'PyQt6 / QtWebEngine / web assets are packaged into the onefile executable.'

      - name: Upload single EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-Windows-x64-SingleEXE
          path: dist/PDFBubbleAnnotator.exe
          if-no-files-found: error
