name: Build Single EXE Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vendor browser libraries for offline runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'web\vendor'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $items = @(
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', "$root\pdf.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js', "$root\pdf.worker.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', "$root\pdf-lib.min.js"),
            @('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', "$root\three.min.js"),
            @('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js', "$root\OrbitControls.js"),
            @('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js', "$root\STLLoader.js"),
            @('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js', "$root\OBJLoader.js"),
            @('https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js', "$root\occt-import-js.js"),
            @('https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.wasm', "$root\occt-import-js.wasm")
          )
          foreach ($x in $items) {
            Invoke-WebRequest -Uri $x[0] -OutFile $x[1]
            if ((Get-Item $x[1]).Length -lt 1000) { throw "Invalid dependency: $($x[1])" }
          }
          $qtZip = Join-Path $env:RUNNER_TEMP 'qtwebchannel-6.8.3.zip'
          $qtExtract = Join-Path $env:RUNNER_TEMP 'qtwebchannel-6.8.3'
          Invoke-WebRequest -Uri 'https://download.qt.io/official_releases/qt/6.8/6.8.3/submodules/qtwebchannel-everywhere-src-6.8.3.zip' -OutFile $qtZip
          if ((Get-Item $qtZip).Length -lt 100000) { throw 'Qt WebChannel archive download is invalid' }
          if (Test-Path $qtExtract) { Remove-Item $qtExtract -Recurse -Force }
          Expand-Archive -Path $qtZip -DestinationPath $qtExtract -Force
          $qwc = Get-ChildItem -Path $qtExtract -Filter 'qwebchannel.js' -File -Recurse | Select-Object -First 1
          if ($null -eq $qwc) { throw 'qwebchannel.js was not found in Qt WebChannel archive' }
          Copy-Item $qwc.FullName "$root\qwebchannel.js" -Force
          if ((Get-Item "$root\qwebchannel.js").Length -lt 10000) { throw 'Invalid qwebchannel.js' }
      - name: Vendor LibreDWG WebAssembly for offline DWG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'libredwg'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          npm pack @mlightcad/libredwg-web@0.7.9
          $tgz = Get-ChildItem -Filter '*.tgz' | Select-Object -First 1
          if ($null -eq $tgz) { throw 'LibreDWG npm package was not downloaded' }
          tar -xzf $tgz.FullName
          Pop-Location
          $pkg = Join-Path $tmp 'package'
          if (-not (Test-Path (Join-Path $pkg 'dist\index.js'))) { throw 'LibreDWG dist/index.js missing' }
          if (-not (Test-Path (Join-Path $pkg 'wasm\libredwg.wasm'))) { throw 'LibreDWG WASM missing' }
          $dst = 'web\vendor\libredwg'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $pkg 'dist') (Join-Path $dst 'dist') -Recurse -Force
          Copy-Item (Join-Path $pkg 'wasm') (Join-Path $dst 'wasm') -Recurse -Force
          Write-Host 'LibreDWG offline runtime bundled.'
      - name: Validate source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @('web\index.html','web\formats.js','web\runtime_fix.js','web\feature_suite.js','web\measurement_suite.js','web\annotation_suite.js','web\local_zoom.js','web\cad_export.js','web\drawing_suite.js','web\3d_cad_suite.js','main.py','app.ico','web\vendor\pdf.min.js','web\vendor\pdf.worker.min.js','web\vendor\pdf-lib.min.js','web\vendor\qwebchannel.js','web\vendor\three.min.js','web\vendor\OrbitControls.js','web\vendor\STLLoader.js','web\vendor\OBJLoader.js','web\vendor\occt-import-js.js','web\vendor\occt-import-js.wasm','web\vendor\libredwg\dist\index.js','web\vendor\libredwg\wasm\libredwg.wasm')) {
            if (-not (Test-Path $p)) { throw "Required source/dependency missing: $p" }
          }
          python -m py_compile main.py
          node --check web\formats.js
          node --check web\feature_suite.js
          node --check web\measurement_suite.js
          node --check web\annotation_suite.js
          node --check web\runtime_fix.js
          node --check web\local_zoom.js
          node --check web\cad_export.js
          node --check web\drawing_suite.js
          node --check web\3d_cad_suite.js
      - name: Build single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --onefile --windowed --name PDFBubbleAnnotator --icon app.ico `
            --add-data "web;web" `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --collect-all PyQt6.QtWebChannel `
            main.py
          if (-not (Test-Path 'dist\PDFBubbleAnnotator.exe')) { throw 'EXE was not produced' }
          $size = (Get-Item 'dist\PDFBubbleAnnotator.exe').Length
          Write-Host "Single EXE size: $size bytes"
          if ($size -lt 20000000) { throw 'EXE is unexpectedly small; WebEngine was probably not bundled' }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\PDFBubbleAnnotator.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Output is not a Windows PE executable' }
          Write-Host 'PE header verification passed'
          Write-Host 'Single-file PyQt6/QtWebEngine executable created.'
      - name: Upload single EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-Windows-x64-SingleEXE
          path: dist/PDFBubbleAnnotator.exe
          if-no-files-found: error
