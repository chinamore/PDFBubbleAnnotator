name: Build Single EXE Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vendor browser libraries for offline runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'web\vendor'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $items = @(
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', "$root\pdf.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js', "$root\pdf.worker.min.js"),
            @('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', "$root\pdf-lib.min.js")
          )
          foreach ($x in $items) {
            Invoke-WebRequest -Uri $x[0] -OutFile $x[1]
            if ((Get-Item $x[1]).Length -lt 1000) { throw "Invalid dependency: $($x[1])" }
          }
          $qtZip = Join-Path $env:RUNNER_TEMP 'qtwebchannel-6.8.3.zip'
          $qtExtract = Join-Path $env:RUNNER_TEMP 'qtwebchannel-6.8.3'
          Invoke-WebRequest -Uri 'https://download.qt.io/official_releases/qt/6.8/6.8.3/submodules/qtwebchannel-everywhere-src-6.8.3.zip' -OutFile $qtZip
          if ((Get-Item $qtZip).Length -lt 100000) { throw 'Qt WebChannel archive download is invalid' }
          if (Test-Path $qtExtract) { Remove-Item $qtExtract -Recurse -Force }
          Expand-Archive -Path $qtZip -DestinationPath $qtExtract -Force
          $qwc = Get-ChildItem -Path $qtExtract -Filter 'qwebchannel.js' -File -Recurse | Select-Object -First 1
          if ($null -eq $qwc) { throw 'qwebchannel.js was not found in Qt WebChannel archive' }
          Copy-Item $qwc.FullName "$root\qwebchannel.js" -Force
          if ((Get-Item "$root\qwebchannel.js").Length -lt 10000) { throw 'Invalid qwebchannel.js' }
      - name: Validate source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @('web\index.html','web\runtime_fix.js','web\feature_suite.js','web\measurement_suite.js','web\annotation_suite.js','main.py','app.ico','web\vendor\pdf.min.js','web\vendor\pdf.worker.min.js','web\vendor\pdf-lib.min.js','web\vendor\qwebchannel.js')) {
            if (-not (Test-Path $p)) { throw "Required source/dependency missing: $p" }
          }
          python -m py_compile main.py
          node --check web\feature_suite.js
          node --check web\measurement_suite.js
          node --check web\annotation_suite.js
          node --check web\runtime_fix.js
      - name: Build single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --onefile --windowed --name PDFBubbleAnnotator --icon app.ico `
            --add-data "web;web" `
            --add-data "app.ico;." `
            --collect-all PyQt6 `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --collect-all PyQt6.QtWebChannel `
            main.py
          if (-not (Test-Path 'dist\PDFBubbleAnnotator.exe')) { throw 'EXE was not produced' }
          $size = (Get-Item 'dist\PDFBubbleAnnotator.exe').Length
          Write-Host "Single EXE size: $size bytes"
          if ($size -lt 20000000) { throw 'EXE is unexpectedly small; WebEngine was probably not bundled' }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\PDFBubbleAnnotator.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Output is not a Windows PE executable' }
          Write-Host 'PE header verification passed'
          Write-Host 'Single-file PyQt6/QtWebEngine executable created.'
      - name: Upload single EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-Windows-x64-SingleEXE
          path: dist/PDFBubbleAnnotator.exe
          if-no-files-found: error
