name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild PDFBubbleAnnotator.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild PDFBubbleAnnotator.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item x64\Release\PDFBubbleAnnotator.exe release\PDFBubbleAnnotator.exe
          if (Test-Path x64\Release\WebView2Loader.dll) { Copy-Item x64\Release\WebView2Loader.dll release\WebView2Loader.dll }
          Copy-Item web release\web -Recurse
          Copy-Item app.ico release\app.ico
          Compress-Archive -Path release\* -DestinationPath PDFBubbleAnnotator-v0.3-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-v0.3-Windows-x64
          path: PDFBubbleAnnotator-v0.3-Windows-x64.zip
          if-no-files-found: error
