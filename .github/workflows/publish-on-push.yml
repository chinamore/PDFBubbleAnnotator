name: Publish Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        shell: pwsh
        run: msbuild .\PDFBubbleAnnotator.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        shell: pwsh
        run: msbuild .\PDFBubbleAnnotator.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path '.\x64\Release\PDFBubbleAnnotator.exe')) { throw 'PDFBubbleAnnotator.exe was not produced.' }
          New-Item -ItemType Directory -Force -Path '.\release\web' | Out-Null
          Copy-Item '.\x64\Release\PDFBubbleAnnotator.exe' '.\release\PDFBubbleAnnotator.exe' -Force
          if (Test-Path '.\x64\Release\WebView2Loader.dll') { Copy-Item '.\x64\Release\WebView2Loader.dll' '.\release\WebView2Loader.dll' -Force }
          Copy-Item '.\web\*' '.\release\web\' -Recurse -Force
          if (Test-Path '.\app.ico') { Copy-Item '.\app.ico' '.\release\app.ico' -Force }
          @'
PDF Bubble Annotator
Windows x64

Run PDFBubbleAnnotator.exe.
Microsoft Edge WebView2 Runtime is required.
'@ | Set-Content '.\release\运行说明.txt' -Encoding UTF8
          Compress-Archive -Path '.\release\PDFBubbleAnnotator.exe','.\release\WebView2Loader.dll','.\release\web','.\release\app.ico','.\release\运行说明.txt' -DestinationPath '.\release\PDFBubbleAnnotator-Windows-x64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-Windows-x64
          path: release/PDFBubbleAnnotator-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v0.3.${{ github.run_number }}"
          gh release create $tag '.\release\PDFBubbleAnnotator-Windows-x64.zip' --repo '${{ github.repository }}' --title "PDF Bubble Annotator $tag" --generate-notes --latest
