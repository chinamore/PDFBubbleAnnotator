name: Public Windows Release
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - shell: pwsh
        run: msbuild .\PDFBubbleAnnotator.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\release | Out-Null
          Copy-Item .\x64\Release\PDFBubbleAnnotator.exe .\release\PDFBubbleAnnotator.exe
          Copy-Item .\web .\release\web -Recurse
          Copy-Item .\app.ico .\release\app.ico
          Compress-Archive -Path .\release\* -DestinationPath .\release\PDFBubbleAnnotator-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PDFBubbleAnnotator-Windows-x64
          path: release/
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v0.1.${{ github.run_number }} .\release\PDFBubbleAnnotator-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --title "PDF Bubble Annotator v0.1.${{ github.run_number }}" --generate-notes --latest
