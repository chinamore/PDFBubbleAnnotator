name: Publish Latest Windows Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for successful Windows build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-windows.yml --branch main --limit 5 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == "'"$GITHUB_SHA"'") | select(.status == "completed" and .conclusion == "success") | .databaseId' | head -n 1)
            if [ -n "$run" ]; then echo "RUN_ID=$run" >> "$GITHUB_ENV"; break; fi
            sleep 10
          done
          test -n "${RUN_ID:-}" || exit 1
      - name: Download Windows artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n PDFBubbleAnnotator-Windows-x64 -D release
      - name: Create release archive
        run: cd release && zip -r ../PDFBubbleAnnotator-Windows-x64.zip .
      - name: Publish release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v0.1.${{ github.run_number }}" PDFBubbleAnnotator-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --title "PDF Bubble Annotator v0.1.${{ github.run_number }}" --generate-notes --latest
